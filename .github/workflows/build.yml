name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Build static Next.js export
        env:
          NEXT_PUBLIC_CHAINWATCH_BUILD_VERSION: ${{ github.sha }}
        run: npm run build --prefix web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l main.go internal/core/*.go)"
      - name: Test and vet Go
        run: |
          go test ./...
          go vet ./...
      - name: Build embedded Linux binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_SHA}" -o bin/chainwatch-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_SHA}" -o bin/chainwatch-linux-arm64 .
          cd bin
          sha256sum chainwatch-linux-* > SHA256SUMS
      - name: Smoke-test the embedded Linux binary
        run: python3 scripts/smoke.py bin/chainwatch-linux-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: chainwatch-linux
          path: |
            bin/chainwatch-linux-amd64
            bin/chainwatch-linux-arm64
            bin/SHA256SUMS
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: chainwatch-linux
          path: bin
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/chainwatch-linux-amd64 bin/chainwatch-linux-arm64 bin/SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
